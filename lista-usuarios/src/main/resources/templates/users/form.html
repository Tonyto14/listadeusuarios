<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <h1 th:text="${title}">Usuário</h1>

    <form th:action="@{${action}}" th:object="${user}" method="post" class="form">
        <div class="field">
            <label for="name">Nome</label>
            <input type="text" id="name" th:field="*{name}">
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="field">
            <label for="arroba">Arroba</label>
            <input type="text" id="arroba" th:field="*{arroba}" placeholder="@usuario">
            <span class="error" th:if="${#fields.hasErrors('arroba')}" th:errors="*{arroba}"></span>
        </div>

        <div class="field">
            <label for="cpf">CPF (somente números)</label>
            <input type="text" id="cpf" th:field="*{cpf}" maxlength="11" inputmode="numeric">
            <span class="error" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></span>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a th:href="@{/users}" class="btn">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
