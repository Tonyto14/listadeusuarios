<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuários')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <div class="toolbar">
        <h1>Usuários <small>(<span th:text="${size}">0</span>)</small></h1>
        <a th:href="@{/users/new}" class="btn btn-primary">+ Novo usuário</a>
    </div>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <p th:if="${#lists.isEmpty(users)}" class="empty">Nenhum usuário cadastrado.</p>

    <table th:unless="${#lists.isEmpty(users)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Arroba</th>
            <th>CPF</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.name}">Nome</td>
            <td th:text="${u.arroba}">@arroba</td>
            <td th:text="${u.cpf}">00000000000</td>
            <td class="actions">
                <a th:href="@{/users/{id}(id=${u.id})}" class="btn">Ver</a>
                <a th:href="@{/users/{id}/edit(id=${u.id})}" class="btn">Editar</a>
                <form th:action="@{/users/{id}/delete(id=${u.id})}" method="post"
                      onsubmit="return confirm('Excluir este usuário?');">
                    <button type="submit" class="btn btn-danger">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
