<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhes')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <h1>Detalhes do usuário</h1>

    <dl class="details">
        <dt>ID</dt>
        <dd th:text="${user.id}">1</dd>
        <dt>Nome</dt>
        <dd th:text="${user.name}">Nome</dd>
        <dt>Arroba</dt>
        <dd th:text="${user.arroba}">@arroba</dd>
        <dt>CPF</dt>
        <dd th:text="${user.cpf}">00000000000</dd>
    </dl>

    <div class="form-actions">
        <a th:href="@{/users/{id}/edit(id=${user.id})}" class="btn btn-primary">Editar</a>
        <a th:href="@{/users}" class="btn">Voltar</a>
    </div>
</main>
</body>
</html>
